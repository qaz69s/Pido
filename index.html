    <link rel="manifest" href="./manifest.webmanifest" />

    <meta name="apple-mobile-web-app-title" content="Pido" />
    <title>Pido</title>
    <script>
      // 在 Vue 挂载前先应用主题，避免深色模式下页面闪白
      ;(function () {
        try {
          var mode = localStorage.getItem('mihomo-dashboard:theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          // 配色方案
          document.documentElement.dataset.theme =
            (localStorage.getItem('mihomo-dashboard:preset') || 'default').replace(/^(matcha|jade)$/, 'neutral')
          // 动画开关：没设置过时跟随系统「减少动画」
          var motion = localStorage.getItem('mihomo-dashboard:motion')
          document.documentElement.dataset.motion =
            motion || (window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'on')
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-CCwG7rKy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DiT4dBJX.css">
  </head>

    <div id="app"></div>
  </body>
</html>
